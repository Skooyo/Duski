<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" />
  <title>Duski translation overlay</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    .block {
      position: absolute; box-sizing: border-box; display: flex; align-items: center; padding: 0 2px; border-radius: 3px;
      font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; font-weight: 500; line-height: 1.15;
      overflow: hidden; overflow-wrap: anywhere; animation: in 0.15s ease-out;
    }
    @keyframes in { from { opacity: 0; } }
    body { transition: opacity 0.15s; }
    body.off { opacity: 0; } /* "Overlay" off in the popup: the original text shows again */
    @media (prefers-reduced-motion: reduce) { .block { animation: none; } body { transition: none; } }
  </style>
</head>
<body>
  <script src="../dist/renderer/overlay.js"></script>
</body>
</html>
